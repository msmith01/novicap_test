# Single-host deployment (any VPS with Docker). HTTPS terminates at Caddy; Postgres, Prometheus
# and Alertmanager are not published to the internet. Secrets come from a .env file (see deploy/VPS.md).
# Usage: docker compose -f docker-compose.vps.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: risk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk"]
      interval: 5s
      retries: 20
  api:
    build:
      context: .
      args:
        IMAGE_VERSION: ${IMAGE_VERSION:-vps}
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEYS:?set API_KEYS}
      DATABASE_URL: postgresql+psycopg://risk:${POSTGRES_PASSWORD}@db:5432/risk
      IMAGE_VERSION: ${IMAGE_VERSION:-vps}
      ACTIVE_RULESET: ${ACTIVE_RULESET:-2026-10-v1}
      SHADOW_RULESET: ${SHADOW_RULESET:-}
      CANARY_RULESET: ${CANARY_RULESET:-}
      CANARY_PERCENT: ${CANARY_PERCENT:-0}
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus/api_key:/etc/prometheus/api_key:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - alertmanager
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/alertmanager/discord_webhook:/etc/alertmanager/discord_webhook:ro
    ports:
      - "127.0.0.1:9093:9093"

volumes:
  pgdata:
  caddy_data:
  promdata:
