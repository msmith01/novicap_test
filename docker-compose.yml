# Local stack only: throwaway Postgres credentials, API key from the environment.
# Usage: $env:API_KEYS="dev-key"; docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk-local-only
      POSTGRES_DB: risk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      args:
        IMAGE_VERSION: local
    environment:
      API_KEYS: ${API_KEYS:?set API_KEYS}
      SHADOW_RULESET: ${SHADOW_RULESET:-}
      CANARY_RULESET: ${CANARY_RULESET:-}
      CANARY_PERCENT: ${CANARY_PERCENT:-0}
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      DATABASE_URL: postgresql+psycopg://risk:risk-local-only@db:5432/risk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus/api_key:/etc/prometheus/api_key:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - alertmanager
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/alertmanager/discord_webhook:/etc/alertmanager/discord_webhook:ro
    ports:
      - "9093:9093"
