# Alerts are posted to a Discord channel. The webhook URL is a secret (anyone holding it can post),
# so it is read from ops/alertmanager/discord_webhook, which is git-ignored. Copy
# discord_webhook.example to discord_webhook and put the real URL in it.
# severity=page alerts repeat every 30 minutes; severity=ticket alerts every 12 hours.
route:
  receiver: discord-ticket
  group_by: [alertname]
  group_wait: 10s
  routes:
    - matchers: [severity="page"]
      receiver: discord-page
      repeat_interval: 30m
    - matchers: [severity="ticket"]
      receiver: discord-ticket
      repeat_interval: 12h
receivers:
  - name: discord-ticket
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_webhook
        send_resolved: true
        title: 'TICKET {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
  - name: discord-page
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_webhook
        send_resolved: true
        title: 'PAGE {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
